name: pkgcheck

# This will cancel running jobs once a new run is triggered
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref }}
  cancel-in-progress: true

on:
  # Manually trigger the Action under Actions/pkgcheck
  workflow_dispatch:
  # Run after R-CMD-check completes so pkgcheck's CI check sees final statuses.
  workflow_run:
    workflows:
      - R-CMD-check
    types:
      - completed
    branches:
      - main

jobs:
  pkgcheck:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      # pkgcheck runs in a Docker action and otherwise sees CRAN only. Use a
      # project profile so pak can resolve the optional fmridesign integration.
      # The container runs as root against a runner-owned bind mount, so its
      # libgit2 also needs the exact mounted path in the container HOME config.
      - name: Configure pkgcheck container
        run: |
          cp .github/pkgcheck.Rprofile .Rprofile
          mkdir -p "$RUNNER_TEMP/_github_home"
          git config --file "$RUNNER_TEMP/_github_home/.gitconfig" \
            --add safe.directory /github/workspace

      - uses: ropensci-review-tools/pkgcheck-action@main
        with:
          # The exact ref is already checked out above; preserve the temporary
          # .Rprofile instead of letting the composite action clean the tree.
          ref: ''
